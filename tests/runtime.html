<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2D Doll Runtime Tests — Running</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0d121a; color: #edf3fb; }
    header { padding: 1rem 1.2rem; border-bottom: 1px solid #34445b; }
    h1 { margin: 0 0 .3rem; font-size: 1.35rem; }
    #summary { margin: 0; color: #aebcd0; }
    main { display: grid; grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); gap: 1rem; padding: 1rem; }
    #results { margin: 0; padding: 0; list-style: none; }
    #results li { margin-bottom: .45rem; padding: .55rem .7rem; border: 1px solid #33445c; border-radius: 8px; background: #172131; }
    #results .pass { border-left: 5px solid #38cf79; }
    #results .fail { border-left: 5px solid #ff657e; }
    #results strong { display: block; }
    #results pre { white-space: pre-wrap; color: #ffb9c5; font-size: .75rem; }
    iframe { width: 100%; min-height: 760px; border: 1px solid #34445b; border-radius: 10px; background: white; }
    body[data-status="pass"] #summary { color: #72e6a5; }
    body[data-status="fail"] #summary { color: #ff8da0; }
    @media(max-width: 960px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-status="running">
  <header>
    <h1>Canonical Runtime Browser Tests</h1>
    <p id="summary">Loading the real runtime and provisional artwork…</p>
  </header>
  <main>
    <ol id="results"></ol>
    <iframe id="runtime" title="Canonical poser runtime under test"></iframe>
  </main>
  <script type="module" src="runtime-browser-tests.js"></script>
</body>
</html>
